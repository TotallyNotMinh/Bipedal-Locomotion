<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Terrain Visualizer</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0f172a; font-family: sans-serif; color: #f8fafc; }
    #canvas-container { width: 100vw; height: 100vh; }
    #ui {
      position: absolute; top: 16px; left: 16px; background: rgba(15, 23, 42, 0.85);
      padding: 16px; border-radius: 8px; border: 1px solid #334155; backdrop-filter: blur(8px);
      max-width: 320px;
    }
    h2 { margin: 0 0 10px 0; font-size: 16px; color: #38bdf8; }
    p { margin: 4px 0; font-size: 12px; color: #94a3b8; }
    .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; margin-right: 4px; }
    .flat { background: #10b981; }
    .rough { background: #f59e0b; }
    .slopes { background: #8b5cf6; }
    .stairs { background: #ef4444; }
    button {
      margin-top: 10px; width: 100%; padding: 8px; background: #0284c7; color: white;
      border: none; border-radius: 4px; cursor: pointer; font-weight: bold;
    }
    button:hover { background: #0369a1; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="ui">
    <h2>MuJoCo Procedural Terrain</h2>
    <p><b>Arena:</b> 56m × 56m grid (6×6 sub-terrains)</p>
    <p><b>Resolution:</b> 5cm per heightfield cell</p>
    <p style="margin-top: 8px;"><b>Sub-terrain Types:</b></p>
    <div style="margin-top: 4px;">
      <span class="badge flat">Flat (Row 0)</span>
      <span class="badge rough">Rough Perlin</span>
      <span class="badge slopes">Slopes</span>
      <span class="badge stairs">Stairs</span>
    </div>
    <p style="margin-top: 12px;"><b>Mouse Controls:</b></p>
    <p>Left drag: Orbit | Right drag: Pan | Scroll: Zoom</p>
    <button onclick="toggleWireframe()">Toggle Wireframe</button>
  </div>
  <div id="canvas-container"></div>

  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);
    scene.fog = new THREE.FogExp2(0x0f172a, 0.015);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(28, -25, 30);
    camera.up.set(0, 0, 1);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.set(28, 28, 0);
    controls.update();

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const sun = new THREE.DirectionalLight(0xffffff, 0.9);
    sun.position.set(40, -20, 50);
    sun.castShadow = true;
    scene.add(sun);

    // Procedural terrain mesh simulation matching python code
    const sizeX = 56, sizeY = 56;
    const segs = 140; // Downsampled grid for smooth WebGL rendering
    const geometry = new THREE.PlaneGeometry(sizeX, sizeY, segs, segs);
    geometry.translate(sizeX / 2, sizeY / 2, 0);

    const pos = geometry.attributes.position;
    const colors = [];
    const color = new THREE.Color();

    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const y = pos.getY(i);

      let z = 0;
      const row = Math.floor(x / 8.0);
      const col = Math.floor(y / 8.0);

      if (row === 0) {
        // Flat
        z = 0;
        color.setRGB(0.2, 0.7, 0.4);
      } else if ((row + col) % 3 === 0) {
        // Harmonic rough
        z = Math.sin(x * 1.5) * Math.cos(y * 1.5) * 0.08 + Math.sin(x * 3.0) * 0.03;
        color.setRGB(0.85, 0.6, 0.2);
      } else if ((row + col) % 3 === 1) {
        // Slopes
        z = ((x % 8.0) / 8.0) * 0.4;
        color.setRGB(0.5, 0.4, 0.85);
      } else {
        // Stairs
        const step = Math.floor((x % 8.0) / 0.5);
        z = step * 0.06;
        color.setRGB(0.85, 0.3, 0.3);
      }

      pos.setZ(i, z);
      colors.push(color.r, color.g, color.b);
    }

    geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    geometry.computeVertexNormals();

    const material = new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.8,
      metalness: 0.1,
      flatShading: true,
    });

    const terrainMesh = new THREE.Mesh(geometry, material);
    terrainMesh.receiveShadow = true;
    scene.add(terrainMesh);

    // Add coordinate grid
    const gridHelper = new THREE.GridHelper(56, 7, 0x38bdf8, 0x334155);
    gridHelper.position.set(28, 28, -0.05);
    gridHelper.rotation.x = Math.PI / 2;
    scene.add(gridHelper);

    function toggleWireframe() {
      material.wireframe = !material.wireframe;
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
