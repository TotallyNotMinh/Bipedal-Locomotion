experiment:
  name: "g1_flat"
  seed: 42
  output_dir: "results/flat"

env:
  task_name: "G1JoystickFlatTerrain"
  impl: "jax"
  episode_length: 1000
  action_repeat: 1
  ctrl_dt: 0.02
  sim_dt: 0.002
  domain_randomization: true
  lin_vel_x: [0.3, 1.0]
  lin_vel_y: [0.0, 0.0]
  ang_vel_yaw: [0.0, 0.0]

ppo:
  num_timesteps: 50000000
  num_envs: 4096
  num_eval_envs: 128
  num_evals: 20
  num_resets_per_eval: 1
  unroll_length: 20
  batch_size: 256
  num_minibatches: 32
  num_updates_per_batch: 4
  learning_rate: 0.0003
  entropy_cost: 0.005
  discounting: 0.97
  gae_lambda: 0.95
  clipping_epsilon: 0.2
  max_grad_norm: 1.0
  reward_scaling: 1.0
  normalize_observations: true
  normalize_advantage: true
  deterministic_eval: true

network:
  policy_hidden_layer_sizes: [512, 256, 128]
  value_hidden_layer_sizes: [512, 256, 128]
  policy_obs_key: "state"
  value_obs_key: "privileged_state"
  activation: "swish"
  distribution_type: "tanh_normal"
