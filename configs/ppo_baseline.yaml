# Shared Baseline PPO & Environment Configuration (M1)
# All comparison models (M1, M2, M3, M4) inherit this exact setup so that
# reward, environment dynamics, step budget, and PPO hyperparameters remain identical.

experiment:
  name: "g1_m1_baseline"
  seed: 42
  output_dir: "results"

env:
  # Upstream MuJoCo Playground G1 locomotion task
  task_name: "G1JoystickFlatTerrain"
  # Use "jax" backend for Dual NVIDIA Tesla T4 compatibility (SM 7.5)
  impl: "jax"
  episode_length: 1000
  action_repeat: 1
  ctrl_dt: 0.02
  sim_dt: 0.002
  domain_randomization: true

  # Terrain integration mode:
  # - "playground": unmodified upstream MuJoCo Playground task (flat / rough)
  # - "singular":   inject heightfield from configs/terrain.yaml via src/envs/terrain.py
  terrain_mode: "playground"
  terrain_config_path: "configs/terrain.yaml"
  terrain_category: "flat"
  terrain_difficulty: 0.0
  terrain_downsample: 1

ppo:
  num_timesteps: 50000000
  # Divisible across Dual T4 GPUs (2048 envs per GPU)
  num_envs: 4096
  num_eval_envs: 128
  num_evals: 20
  num_resets_per_eval: 1
  unroll_length: 20
  # Note: Brax requires (batch_size * num_minibatches) % num_envs == 0
  batch_size: 256
  num_minibatches: 32
  num_updates_per_batch: 4
  learning_rate: 0.0003
  entropy_cost: 0.005
  discounting: 0.97
  gae_lambda: 0.95
  clipping_epsilon: 0.2
  max_grad_norm: 1.0
  reward_scaling: 1.0
  normalize_observations: true
  normalize_advantage: true
  deterministic_eval: true
  log_training_metrics: false

network:
  model_id: "M1"
  activation: "swish"
  distribution_type: "tanh_normal"
  policy_obs_key: "state"
  value_obs_key: "privileged_state"
  policy_hidden_layer_sizes: [512, 256, 128]
  value_hidden_layer_sizes: [512, 256, 128]

eval:
  num_episodes: 20
  friction_switch_enabled: false
  friction_switch_step: 250
  nominal_friction: 1.0
  switched_friction: 0.2
  push_enabled: false
  push_step: 300
  push_velocity: 0.5
