# M2 (capacity control MLP) — G1 đi bộ trên mặt phẳng, môi trường của Minh.
#
# File này CHỈ chứa phần Minh chưa định nghĩa (PPO + mạng). KHÔNG có tham số
# môi trường ở đây: địa hình, dải lệnh, tần số, num_envs... đều được đọc trực
# tiếp từ configs/terrain.yaml và G1EnvConfig/train_kaggle.py của Minh.

experiment:
  name: "g1_flat_m2"
  model_id: "M2"
  seed: 42                    # = mặc định --seed của train_kaggle.py
  output_dir: "results/flat"

# Giá trị mặc định lấy theo scripts/train_kaggle.py của Minh.
minh:
  category: "flat"
  difficulty: 0.0
  num_envs: 4096              # = --num-envs mặc định của train_kaggle.py
  terrain_config_path: "configs/terrain.yaml"

# PPO: bộ hyperparameter chính thức của MuJoCo Playground cho G1 Joystick
# (brax_ppo_config), trừ num_envs (lấy của Minh) và num_timesteps (100M).
ppo:
  num_timesteps: 100000000
  num_eval_envs: 128
  num_evals: 20
  num_resets_per_eval: 1
  unroll_length: 20
  batch_size: 256             # batch_size * num_minibatches phải chia hết num_envs
  num_minibatches: 32
  num_updates_per_batch: 4
  learning_rate: 0.0003
  entropy_cost: 0.005
  discounting: 0.97
  gae_lambda: 0.95
  clipping_epsilon: 0.2
  max_grad_norm: 1.0
  reward_scaling: 1.0
  normalize_observations: true
  normalize_advantage: true
  deterministic_eval: true
  restore_checkpoint_path: null   # train tiếp từ checkpoint (cùng kiến trúc)

network:
  policy_hidden_layer_sizes: [896, 448, 128]
  value_hidden_layer_sizes: [512, 256, 128]
  policy_obs_key: "state"
  value_obs_key: "privileged_state"
  activation: "swish"
  distribution_type: "tanh_normal"
