# Kịch bản đánh giá CỐ ĐỊNH, dùng chung cho mọi model (M1..M4) để so sánh công bằng.
# Mọi lệnh phải nằm trong dải lệnh của Minh (vx 0.2-1.0, vy +-0.3, wz +-0.5), nên vx >= 0.2.
seed: 123            # seed khởi tạo trạng thái đầu (cùng seed => cùng spawn cho mọi model)
n_envs: 64
max_steps: 1000      # 20 s @ 50 Hz
warmup_steps: 50     # bỏ 1 s đầu khi tính sai số

# Ngưỡng TẠM do M2 đặt, CHƯA được nhóm thống nhất (xem readme_report.md, Open questions).
thresholds:
  provisional: true
  min_success_rate: 0.95
  max_rmse_vx: 0.25
  max_rmse_vy: 0.25
  max_rmse_wz: 0.30

scenarios:
  random:        null              # lệnh ngẫu nhiên theo đúng cách train của Minh
  slow:          [0.2, 0.0, 0.0]
  forward_0.5:   [0.5, 0.0, 0.0]
  forward_1.0:   [1.0, 0.0, 0.0]
  left_0.3:      [0.2, 0.3, 0.0]
  right_0.3:     [0.2, -0.3, 0.0]
  turn_left:     [0.2, 0.0, 0.5]
  turn_right:    [0.2, 0.0, -0.5]
  fast_turn:     [1.0, 0.0, 0.5]
  diagonal:      [0.6, 0.3, 0.3]
